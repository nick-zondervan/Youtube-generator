<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowNick - YouTube Titel Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .result-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .result-content {
            color: #555;
            line-height: 1.6;
        }
        
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
        }
        
        .copy-btn:hover {
            background: #5568d3;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 FlowNick YouTube Generator</h1>
        <p class="subtitle">Genereer video titels en beschrijvingen met AI</p>
        
        <div class="info-box">
            ℹ️ Je hebt alleen een Anthropic API key nodig. Krijg er gratis een op <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
        </div>
        
        <div class="input-group">
            <label for="apiKey">Anthropic API Key</label>
            <input type="password" id="apiKey" placeholder="sk-ant-api03-..." />
        </div>
        
        <div class="input-group">
            <label for="topic">Onderwerp voor je video</label>
            <textarea id="topic" placeholder="Bijvoorbeeld: Hoe je Claude gebruikt voor business automation"></textarea>
        </div>
        
        <button id="generateBtn" onclick="generateContent()">✨ Genereer YouTube Content</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Claude is aan het werk...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <h3>📋 Jouw YouTube Content:</h3>
            
            <div class="result-item">
                <div class="result-label">Titel</div>
                <div class="result-content" id="titleContent"></div>
                <button class="copy-btn" onclick="copyToClipboard('titleContent')">📋 Kopieer</button>
            </div>
            
            <div class="result-item">
                <div class="result-label">Beschrijving</div>
                <div class="result-content" id="descriptionContent"></div>
                <button class="copy-btn" onclick="copyToClipboard('descriptionContent')">📋 Kopieer</button>
            </div>
            
            <div class="result-item">
                <div class="result-label">Tags (gescheiden met komma)</div>
                <div class="result-content" id="tagsContent"></div>
                <button class="copy-btn" onclick="copyToClipboard('tagsContent')">📋 Kopieer</button>
            </div>
        </div>
    </div>

    <script>
        async function generateContent() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const topic = document.getElementById('topic').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            
            // Reset
            error.classList.remove('show');
            result.classList.remove('show');
            
            // Validatie
            if (!apiKey) {
                showError('Vul je API key in!');
                return;
            }
            
            if (!topic) {
                showError('Vul een onderwerp in!');
                return;
            }
            
            // Start loading
            generateBtn.disabled = true;
            loading.classList.add('show');
            
            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1500,
                        messages: [{
                            role: 'user',
                            content: `Je bent een YouTube SEO expert voor het kanaal FlowNick (AI & Software content).

Maak YouTube content voor dit onderwerp:
"${topic}"

Geef:
1. TITEL (max 60 karakters, pakkend, keyword-rich)
2. BESCHRIJVING (200 woorden, met timestamps structuur, call-to-action)
3. TAGS (15 tags, mix Nederlands en Engels)

Format je antwoord EXACT zo:

TITEL:
[De titel hier]

BESCHRIJVING:
[De beschrijving hier]

TAGS:
[tag1, tag2, tag3, etc]`
                        }]
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`API error ${response.status}: ${errorData.error?.message || 'Onbekende fout'}`);
                }
                
                const data = await response.json();
                const content = data.content[0].text;
                
                // Parse de response
                const titleMatch = content.match(/TITEL:\s*\n(.*?)(?=\n\n)/s);
                const descriptionMatch = content.match(/BESCHRIJVING:\s*\n(.*?)(?=\n\nTAGS:)/s);
                const tagsMatch = content.match(/TAGS:\s*\n(.*?)$/s);
                
                if (titleMatch && descriptionMatch && tagsMatch) {
                    document.getElementById('titleContent').textContent = titleMatch[1].trim();
                    document.getElementById('descriptionContent').textContent = descriptionMatch[1].trim();
                    document.getElementById('tagsContent').textContent = tagsMatch[1].trim();
                    
                    result.classList.add('show');
                } else {
                    showError('Kon de response niet goed parsen. Probeer opnieuw.');
                }
                
            } catch (err) {
                console.error('Full error:', err);
                showError('Error: ' + err.message + '. Check de browser console (F12) voor details.');
            } finally {
                generateBtn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.add('show');
        }
        
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Gekopieerd naar clipboard!');
            });
        }
        
        // Enter key support
        document.getElementById('topic').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateContent();
            }
        });
    </script>
</body>
</html>
